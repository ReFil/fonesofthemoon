
services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: kamailio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      SIP_DOMAIN: ${SIP_DOMAIN}
      ASTERISK_SECRET: ${ASTERISK_SECRET}
      ASTERISK_NUMBER: ${ASTERISK_NUMBER}
    networks:
      kamailio-net:
        ipv4_address: 172.16.11.2
    volumes:
      - /mnt/Main/apps/kamailio-db:/var/lib/postgresql/data
      - /mnt/Main/apps/phones-config/init.sql.template:/tmp/init.sql.template:ro
    command: |
      sh -c '
        sed -e "s|__SIP_DOMAIN__|${SIP_DOMAIN}|g" \
            -e "s|__ASTERISK_NUMBER__|${ASTERISK_NUMBER}|g" \
            -e "s|__ASTERISK_SECRET__|${ASTERISK_SECRET}|g" \
            /tmp/init.sql.template > /docker-entrypoint-initdb.d/init.sql &&
        exec docker-entrypoint.sh postgres
      '
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: kamailio-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      kamailio-net:
        ipv4_address: 172.16.11.3
    ports:
      - '${PGADMIN_PORT}:80'
    volumes:
      - /mnt/Main/apps/kamailio-pgadmin:/var/lib/pgadmin
      - /mnt/Main/apps/phones-config/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  kamailio:
    image: ghcr.io/kamailio/kamailio:${KAMAILIO_VERSION}
    container_name: kamailio
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      SIP_DOMAIN: ${SIP_DOMAIN}
      KAMAILIO_SIP_PORT: ${KAMAILIO_SIP_PORT}
      ASTERISK_PUBLIC_IP: ${ASTERISK_PUBLIC_IP}

    networks:
      kamailio-net:
        ipv4_address: 172.16.11.4
    ports:
      - ${KAMAILIO_SIP_PORT}:${KAMAILIO_SIP_PORT}/udp
    volumes:
      - /mnt/Main/apps/phones-config/kamailio.cfg.template:/etc/kamailio/kamailio.cfg.template
    entrypoint: [""]
    command: |
      sh -c '
        sed -e "s|__DB_HOST__|${DB_HOST}|g" \
            -e "s|__DB_PORT__|${DB_PORT}|g" \
            -e "s|__DB_NAME__|${DB_NAME}|g" \
            -e "s|__DB_USER__|${DB_USER}|g" \
            -e "s|__DB_PASSWORD__|${DB_PASSWORD}|g" \
            -e "s|__SIP_DOMAIN__|${SIP_DOMAIN}|g" \
            -e "s|__KAMAILIO_SIP_PORT__|${KAMAILIO_SIP_PORT}|g" \
            -e "s|__ASTERISK_PUBLIC_IP__|${ASTERISK_PUBLIC_IP}|g" \
            /etc/kamailio/kamailio.cfg.template > /etc/kamailio/kamailio.cfg &&
        exec kamailio -DD -E
      '
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: webdevops/php-nginx:${WEB_PHP_VERSION}
    container_name: kamailio-web
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SIP_DOMAIN: ${SIP_DOMAIN}
      WEB_ADMIN_HASH: ${WEB_ADMIN_HASH}
    networks:
      kamailio-net:
        ipv4_address: 172.16.11.5
    ports:
      - '${WEB_PORT}:80'
    volumes:
      - /mnt/Main/apps/phones-config/web/index.php:/app/index.php
    depends_on:
      postgres:
        condition: service_healthy

  asterisk:
    image: andrius/asterisk:${ASTERISK_VERSION}
    container_name: asterisk
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SIP_DOMAIN: ${SIP_DOMAIN}
      KAMAILIO_SIP_PORT: ${KAMAILIO_SIP_PORT}
      ASTERISK_SECRET: ${ASTERISK_SECRET}
      ASTERISK_NUMBER: ${ASTERISK_NUMBER}
      ASTERISK_PUBLIC_IP: ${ASTERISK_PUBLIC_IP}
      ASTERISK_SIP_PORT: ${ASTERISK_SIP_PORT}
    networks:
      kamailio-net:
        ipv4_address: 172.16.11.6
    ports:
      - ${ASTERISK_SIP_PORT}:${ASTERISK_SIP_PORT}/udp
      - "20000-20100:20000-20100/udp"
    volumes:
      - /mnt/Main/apps/phones-config/asterisk/pjsip.conf.template:/etc/asterisk/pjsip.conf.template
      - /mnt/Main/apps/phones-config/asterisk/rtp.conf:/etc/asterisk/rtp.conf
      - /mnt/Main/apps/phones-config/asterisk/asterisk.conf:/etc/asterisk/asterisk.conf
      - /mnt/Main/apps/phones-config/asterisk/extensions.conf.template:/etc/asterisk/extensions.conf.template
      - /mnt/Main/apps/phones-config/asterisk/agi/group_call.agi:/var/lib/asterisk/agi-bin/group_call.agi
      - /mnt/Main/apps/phones-config/asterisk/sounds:/var/lib/asterisk/sounds/custom
    command: |
      sh -c '
        chmod +x /var/lib/asterisk/agi-bin/group_call.agi &&
        sed -e "s|__SIP_DOMAIN__|${SIP_DOMAIN}|g" \
            -e "s|__KAMAILIO_SIP_PORT__|${KAMAILIO_SIP_PORT}|g" \
            -e "s|__ASTERISK_NUMBER__|${ASTERISK_NUMBER}|g" \
            -e "s|__ASTERISK_SECRET__|${ASTERISK_SECRET}|g" \
            -e "s|__ASTERISK_PUBLIC_IP__|${ASTERISK_PUBLIC_IP}|g" \
            -e "s|__ASTERISK_SIP_PORT__|${ASTERISK_SIP_PORT}|g" \
            /etc/asterisk/pjsip.conf.template > /etc/asterisk/pjsip.conf &&
        sed -e "s|__SIP_DOMAIN__|${SIP_DOMAIN}|g" \
            -e "s|__ASTERISK_NUMBER__|${ASTERISK_NUMBER}|g" \
            /etc/asterisk/extensions.conf.template > /etc/asterisk/extensions.conf &&
        exec /usr/sbin/asterisk -f -vvvdddn
      '
    depends_on:
      postgres:
        condition: service_healthy

networks:
  kamailio-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.11.0/24
          gateway: 172.16.11.1